name: Krita Nova Android APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Android ABI
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86_64]
        default: arm64-v8a
      build_type:
        description: CMake build type
        type: choice
        options: [Release, RelWithDebInfo, Debug]
        default: Release
      krita_ref:
        description: Krita commit to build (empty = the one in KRITA_REF)
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'build/**'
      - 'KRITA_REF'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: apk-${{ github.ref }}-${{ inputs.abi || 'arm64-v8a' }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-22.04
    # GitHub-hosted jobs are killed at 6 h. The build step stops a bit earlier so the
    # compiler cache is still saved: a run that times out makes the next one much faster.
    timeout-minutes: 355
    env:
      ABI: ${{ inputs.abi || 'arm64-v8a' }}
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
      NDK_VERSION: 27.3.13750724          # packaging/android/apk/build.gradle
      WORK: /mnt/krita-work                # the runner's big scratch disk
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/julia* || true
          sudo docker image prune --all --force > /dev/null || true
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          df -h / /mnt

      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential git rsync file unzip zip python3-venv python3-dev \
            ninja-build ccache pkg-config patchelf \
            autoconf automake libtool gettext gperf bison flex nasm
          # CMake 3.x on purpose (CMake 4 drops old cmake_minimum_required compatibility)
          pip3 install --user "cmake>=3.28,<4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --install "platform-tools" "platforms;android-36" "platforms;android-33" \
                            "build-tools;36.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "KDECI_ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "KDECI_ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake"

      - name: Fetch Krita source
        run: |
          REF="${{ inputs.krita_ref }}"
          [ -n "$REF" ] || REF="$(tr -d '[:space:]' < KRITA_REF)"
          echo "Building Krita $REF"
          git init -q "$WORK/src"
          cd "$WORK/src"
          git remote add origin https://invent.kde.org/graphics/krita.git
          git fetch -q --depth=1 origin "$REF" \
            || { git remote set-url origin https://github.com/KDE/krita.git; git fetch -q --depth=1 origin "$REF"; }
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %cd %s'
          echo "KRITA_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Add Krita Nova build kit and patches
        run: |
          KIT="$WORK/src/packaging/android/local-build"
          mkdir -p "$KIT"
          cp -r build/. "$KIT/"
          cp -r patches "$KIT/"
          ls -R "$KIT/patches"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/ccache/${{ env.ABI }}
          key: ccache-${{ env.ABI }}-${{ env.BUILD_TYPE }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.ABI }}-${{ env.BUILD_TYPE }}-

      # Same debug signing key on every run, so a new APK installs over the previous one
      - name: Restore debug signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Create debug signing key (first run only)
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "NEW_KEYSTORE=1" >> "$GITHUB_ENV"
          fi

      - name: Save debug signing key
        if: env.NEW_KEYSTORE == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build Krita + APK
        timeout-minutes: 330
        env:
          KRITA_ANDROID_ABI: ${{ env.ABI }}
          KRITA_BUILD_TYPE: ${{ env.BUILD_TYPE }}
          KRITA_SRC: ${{ env.WORK }}/src
          OUT: ${{ github.workspace }}/out
        run: bash "$WORK/src/packaging/android/local-build/build-krita-android.sh"

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK }}/ccache/${{ env.ABI }}
          key: ccache-${{ env.ABI }}-${{ env.BUILD_TYPE }}-${{ github.run_id }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: krita-nova-${{ env.ABI }}-${{ env.KRITA_SHA }}-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.ABI }}
          path: |
            out/*.log
            ${{ env.WORK }}/wd/krita/_build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.WORK }}/wd/krita/_build/krita-deployment.json
          if-no-files-found: ignore

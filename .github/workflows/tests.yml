name: Krita Nova unit tests

on:
  workflow_dispatch:
  push:
    branches: [main, 'nova/**']
    paths:
      - 'patches/**'
      - 'tests/**'
      - 'KRITA_REF'
      - '.github/workflows/tests.yml'

jobs:
  settings-transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and KConfig
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qtbase5-dev libkf5config-dev cmake g++ ninja-build

      - name: Fetch Krita and apply the patches
        run: |
          REF="$(tr -d '[:space:]' < KRITA_REF)"
          git init -q krita && cd krita
          git remote add origin https://invent.kde.org/graphics/krita.git
          git fetch -q --depth=1 origin "$REF" \
            || { git remote set-url origin https://github.com/KDE/krita.git; git fetch -q --depth=1 origin "$REF"; }
          git checkout -q FETCH_HEAD
          for p in ../patches/*.patch; do
            echo "applying $(basename "$p")"
            git apply --whitespace=nowarn "$p"
          done

      - name: Check krita5.xmlgui version hash
        # Krita's CMake refuses to configure when krita5.xmlgui changed without
        # updating krita5_xmlgui_hash_expected (and bumping KRITA5_XMLGUI_VERSION).
        run: |
          python3 - <<'PY'
          import hashlib, re, sys
          xml = open('krita/krita/krita5.xmlgui', encoding='utf-8').read()
          actual = hashlib.md5(re.sub(r'[ \t\r\n]+', '', xml).encode()).hexdigest()
          expected = re.search(r'krita5_xmlgui_hash_expected "([0-9a-f]+)"',
                               open('krita/krita/CMakeLists.txt').read()).group(1)
          print('krita5.xmlgui hash', actual, 'expected', expected)
          sys.exit(0 if actual == expected else 1)
          PY

      - name: Check Krita Nova includes are unconditional
        # An include placed inside e.g. "#if defined(Q_OS_ANDROID) && ..." compiles on
        # one platform/Qt build only. Our headers must be included at #if depth 0.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          ours = re.compile(r'#\s*include\s*[<"](KisTouchFriendlyStyle|KisSettingsTransfer|KisSettingsTransferCore|KisPresetStrokeRenderer|kis_preset_stroke_renderer|kis_tool_eraser|KisPalmRejection)\.h[>"]')
          bad = []
          for path in list(pathlib.Path('krita').rglob('*.cpp')) + list(pathlib.Path('krita').rglob('*.cc')):
              depth = 0
              for n, line in enumerate(path.read_text(errors='ignore').splitlines(), 1):
                  t = line.strip()
                  if re.match(r'#\s*if', t): depth += 1
                  elif re.match(r'#\s*endif', t): depth -= 1
                  elif ours.search(t) and depth > 0: bad.append(f'{path}:{n}: {t}')
          print('\n'.join(bad) or 'all Krita Nova includes are unconditional')
          sys.exit(1 if bad else 0)
          PY

      - name: Check Krita Nova QML files
        # QML is only parsed at runtime, on the tablet: catch syntax errors here.
        run: |
          sudo apt-get install -y --no-install-recommends qtdeclarative5-dev-tools
          QMLLINT=$(command -v qmllint || echo /usr/lib/qt5/bin/qmllint)
          files=$(find krita -name 'Nova*.qml')
          echo "$files"
          [ -z "$files" ] || "$QMLLINT" $files

      - name: Build and run settings transfer tests
        run: |
          cmake -S tests/settings-transfer -B build-tests -G Ninja -DKRITA_SRC="$PWD/krita"
          cmake --build build-tests
          ./build-tests/test_settings_transfer

      - name: Build and run palm rejection tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S tests/palm-rejection -B build-palm -G Ninja -DKRITA_SRC="$PWD/krita"
          cmake --build build-palm
          ./build-palm/test_palm_rejection
